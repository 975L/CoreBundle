---
# Java glob syntax: "**/" requires a separator before the directory, so it never covers the repository root - each excluded directory needs both forms
exclude_paths:
  - "public/**"
  - "**/public/**"
  - "tests/**"
  - "**/tests/**"
  - "vendor/**"
  - "**/vendor/**"
  - ".phpunit.cache/**"
  # The Stimulus vendored for Testing/JsCase: third-party, and in src/ so the bundles depending on this one get it - not this repository's own code to grade
  - "**/src/Testing/stimulus.js"
  - "**.min.js"
  - "**.min.css"
  - "**.map"
  - "**.tpl.php"
