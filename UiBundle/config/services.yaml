              category: 'label.category_sections'
              priority: 54
              pickable: true
              cacheable: true

    # The singular of "collection": one item of the same sources, for a page putting a single entity forward. Cached on the same terms, see CollectionBlockCacheTagProvider
    ui.block.collection_entry:
