    # Its items come from another bundle's own entity (see CollectionSourceProviderInterface), which BlockCacheInvalidationListener knows nothing about - so the source is the one declaring the tags its items are cached under, and its own bundle the one invalidating them. A source declaring none is still rendered live, CollectionBlockCacheTagProvider vetoing the entry rather than letting it go stale forever
    ui.block.collection:
        class: stdClass
        tags:
            - name: ui.block
              kind: collection
