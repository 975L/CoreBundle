services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    c975L\UiBundle\:
        resource: '../src/'
        # Maker/ excluded: it extends symfony/maker-bundle's AbstractMaker, a dev-only dependency - registered separately in services_maker.yaml, imported only when that class is available (see c975LUiBundle::loadExtension()), so a plain resource-glob scan never autoloads it in prod
        # Model/ excluded: plain value objects (e.g. CollectionItem) built by application code, not services - autowiring one fails on its first scalar constructor argument
        # Field/ excluded: EasyAdmin fields, built by their own static new() with a private constructor, which the container refuses to instantiate - a CRUD controller calls them directly, nothing asks the container for one
        # Testing/ excluded: test utilities that ship so the bundles depending on this one can run the same stylesheet analysis over their own sheets, never instantiated by the application itself
        # Video/ excluded: an enum and the value object it builds, read statically by whoever needs them - autowiring ResolvedVideo fails on the enum the container refuses to instantiate
        # Map/ excluded: an enum, read statically for the same reason - the container refuses to instantiate one
        exclude: '../src/{DependencyInjection,Entity,Field,Map,Maker,Model,Testing,Video}'

    # Three classes implement PdfGeneratorInterface - the two engines and the service picking between them - so the contract has to say which one a caller gets. It is the picker: which engine draws a document is decided per site from "ui-pdf-engine", and nothing calling for a PDF has to know there are two (see PdfGenerator)
    c975L\UiBundle\Contract\PdfGeneratorInterface: '@c975L\UiBundle\Service\PdfGenerator'

    c975L\UiBundle\Service\StylesheetProvider:
        tags:
            - { name: 'ui.stylesheet', priority: 100 }
            - { name: 'ui.management_stylesheet', priority: 100 }

    # Between the bundles (100) and an app's own theme files (auto-tagged at -100 by StylesheetRegistryPass): the admin's theme values have to override every bundle's compiled defaults, and to be overridden in turn by any token the site took back in its assets/styles/themes/*.css
    c975L\UiBundle\Service\ThemeVariablesStylesheetProvider:
        tags:
            - { name: 'ui.stylesheet', priority: 0 }

    c975L\UiBundle\Service\ScriptProvider:
        tags:
            - { name: 'ui.script', priority: 100 }
            - { name: 'ui.admin_script', priority: 100 }

    c975L\UiBundle\Controller\FormController:
        arguments:
            $formLimiterFactory: '@?limiter.ui_form'

    # Same reading as the form limiter above: c975LUiBundle prepends "ui_rating" itself, so a public vote route is never served unlimited, and a site that took the limiter away still gets a controller rather than a container that refuses to compile
    c975L\UiBundle\Controller\RatingController:
        arguments:
            $ratingLimiterFactory: '@?limiter.ui_rating'

    # Same reading as the two limiters above: c975LUiBundle prepends "ui_favorite" itself, so the public wishlist routes are never served unlimited, and a site that took the limiter away still gets a controller rather than a container that refuses to compile
    c975L\UiBundle\Controller\FavoriteController:
        arguments:
            $favoriteLimiterFactory: '@?limiter.ui_favorite'

    # Same reading again for the public review form, which writes a row anyone can ask for
    c975L\UiBundle\Controller\ReviewController:
        arguments:
            $reviewLimiterFactory: '@?limiter.ui_review'

    # The application's own secret, which is what makes a review token unforgeable - autowiring has nothing to bind a plain string argument to
    c975L\UiBundle\Service\ReviewTokenSigner:
        arguments:
            $secret: '%kernel.secret%'

    # NelmioSecurityBundle registers its CSP listener under its own service id alone, aliasing nothing on the class - so CspNonceProvider, which type-hints that class, is not autowirable in a consuming app and brings the whole container down on the first cache:clear
    # Wired here rather than aliased: the listener only exists once a site has configured a csp section, and a site that has not is one whose pages carry no nonce at all - it gets an empty one rather than a container that refuses to compile (see CspNonceProvider::styleNonce)
    c975L\UiBundle\Service\CspNonceProvider:
        arguments:
            $listener: '@?nelmio_security.csp_listener'

    # Ui Blocks
    ui.block.article:
        class: stdClass
        tags:
            - name: ui.block
              kind: article
              label: "label.block_article"
              description: "label.block_article_description"
              form: c975L\UiBundle\Form\Block\ArticleType
              translatable: 'title, hook, content'
              template: '@c975LUi/blocks/Article.html.twig'
              category: 'label.category_elements'
              media_types: 'image/*'
              media_multi_upload: true
              priority: 90
              pickable: true
              cacheable: true

    ui.block.alert:
        class: stdClass
        tags:
            - name: ui.block
              kind: alert
              label: "label.block_alert"
              description: "label.block_alert_description"
              form: c975L\UiBundle\Form\Block\AlertType
              translatable: 'content'
              template: '@c975LUi/blocks/Alert.html.twig'
              category: 'label.category_elements'
              priority: 70
              pickable: true
              cacheable: true

    ui.block.audio:
        class: stdClass
        tags:
            - name: ui.block
              kind: audio
              label: "label.block_audio"
              description: "label.block_audio_description"
              form: c975L\UiBundle\Form\Block\AudioType
              translatable: 'title, description'
              template: '@c975LUi/blocks/Audio.html.twig'
              category: 'label.category_media'
              # Explicit list rather than "audio/*", same reasoning as the "video" kind below: these are the formats every browser's <audio> can play, and the block's own form no longer asks for the format, it's read back from the uploaded file's mimeType
              media_types: 'audio/mpeg,audio/ogg,audio/wav'
              media_help: 'label.audio_media_help'
              priority: 70
              pickable: true
              cacheable: true

    ui.block.banner_title:
        class: stdClass
        tags:
            - name: ui.block
              kind: banner_title
              label: "label.block_banner_title"
              description: "label.block_banner_title_description"
              form: c975L\UiBundle\Form\Block\BannerTitleType
              translatable: 'title'
              template: '@c975LUi/blocks/BannerTitle.html.twig'
              category: 'label.category_media'
              media_types: 'image/*'
              media_required: true
              priority: 90
              pickable: true
              cacheable: true

    ui.block.button:
        class: stdClass
        tags:
            - name: ui.block
              kind: button
              label: "label.block_button"
              description: "label.block_button_description"
              form: c975L\UiBundle\Form\Block\ButtonType
              translatable: 'label'
              template: '@c975LUi/blocks/Button.html.twig'
              category: 'label.category_elements'
              priority: 80
              pickable: true
              cacheable: true

    ui.block.card:
        class: stdClass
        tags:
            - name: ui.block
              kind: card
              label: "label.block_card"
              description: "label.block_card_description"
              form: c975L\UiBundle\Form\Block\CardType
              translatable: 'title, content, buttonLabel'
              template: '@c975LUi/blocks/Card.html.twig'
              category: 'label.category_elements'
              media_types: 'image/*'
              priority: 100
              pickable: true
              cacheable: true

    # Never offered in the block picker (pickable: false) - only ever built transiently by CollectionExtension::renderItems(), one per "collection" block item, see CollectionItemType
    # Cacheable, though it has no id to be keyed on: CollectionRuntime names each item after its source and its own slug instead, so one character's card is a single entry every "collection" block pointing at that source hits, on whichever page it sits. A transient item built by anything that does NOT hand such a key (a showcase's fixtures, see GalleryShowcaseProvider) simply isn't cached, there being nothing to identify it by
    ui.block.collection_item:
        class: stdClass
        tags:
            - name: ui.block
              kind: collection_item
              label: "label.block_card"
              form: c975L\UiBundle\Form\Block\CollectionItemType
              translatable: 'title, content, buttonLabel'
              template: '@c975LUi/blocks/CollectionItem.html.twig'
              category: 'label.category_elements'
              pickable: false
              cacheable: true

    ui.block.contact_details:
        class: stdClass
        tags:
            - name: ui.block
              kind: contact_details
              label: "label.block_contact_details"
              description: "label.block_contact_details_description"
              form: c975L\UiBundle\Form\Block\ContactDetailsType
              translatable: 'description'
              template: '@c975LUi/blocks/ContactDetails.html.twig'
              category: 'label.category_elements'
              # Optional logo, shown next to the name and published as the snippet's "image"
              media_types: 'image/*'
              priority: 55
              pickable: true
              cacheable: true

    ui.block.document_download:
        class: stdClass
        tags:
            - name: ui.block
              kind: document_download
              label: "label.block_document_download"
              description: "label.block_document_download_description"
              form: c975L\UiBundle\Form\Block\DocumentDownloadType
              translatable: 'label, buttonLabel'
              template: '@c975LUi/blocks/DocumentDownload.html.twig'
              category: 'label.category_elements'
              media_types: 'application/pdf'
              media_required: true
              media_help: 'label.document_download_media_help'
              priority: 50
              pickable: true
              cacheable: true

    # Two faces of one card, turned by a button (see assets/js/flip-card.js). Its medias are ordered like image_compare's: the first is the front face's image, the second the back's - hence multi upload, an editor picking both in one go
    ui.block.flip_card:
        class: stdClass
        tags:
            - name: ui.block
              kind: flip_card
              label: "label.block_flip_card"
              description: "label.block_flip_card_description"
              form: c975L\UiBundle\Form\Block\FlipCardType
              translatable: 'title, content, backTitle, backContent'
              template: '@c975LUi/blocks/FlipCard.html.twig'
              category: 'label.category_elements'
              media_types: 'image/*'
              # No multi-upload here, unlike the other kinds taking more than one image: this one takes two at most, each belonging to a named face, and a bulk file input beside the collection that already adds them one by one only asked the editor which of the two to use
              media_help: 'label.flip_card_media_help'
              # Right under "card" (100), the kind an editor reaching for this one just looked at
              priority: 99
              pickable: true
              cacheable: true

    ui.block.image:
        class: stdClass
        tags:
            - name: ui.block
              kind: image
              label: "label.block_image"
              description: "label.block_image_description"
              form: c975L\UiBundle\Form\Block\ImageType
              template: '@c975LUi/blocks/Image.html.twig'
              category: 'label.category_media'
              media_types: 'image/*'
              priority: 100
              pickable: true
              cacheable: true

    ui.block.image_compare:
        class: stdClass
        tags:
            - name: ui.block
              kind: image_compare
              label: "label.block_image_compare"
              description: "label.block_image_compare_description"
              form: c975L\UiBundle\Form\Block\ImageCompareType
              translatable: 'beforeLabel, afterLabel'
              template: '@c975LUi/blocks/ImageCompare.html.twig'
              category: 'label.category_media'
              media_types: 'image/*'
              media_required: true
              priority: 85
              pickable: true
              cacheable: true

    # Which provider draws it and which key it draws with are site-wide settings ("ui-map-provider", "ui-map-google-api-key"), never fields of this form - see MapType. Only the title is translatable: a place is where it is in every language, and the collection holding those places is not a per-locale screen (same reading as process_steps)
    ui.block.map:
        class: stdClass
        tags:
            - name: ui.block
              kind: map
              label: "label.block_map"
              description: "label.block_map_description"
              form: c975L\UiBundle\Form\Block\MapType
              translatable: 'title'
              template: '@c975LUi/blocks/Map.html.twig'
              category: 'label.category_media'
              priority: 80
              pickable: true
              cacheable: true

    ui.block.progress_bar:
        class: stdClass
        tags:
            - name: ui.block
              kind: progress_bar
              label: "label.block_progress_bar"
              description: "label.block_progress_bar_description"
              form: c975L\UiBundle\Form\Block\ProgressBarType
              translatable: 'label'
              template: '@c975LUi/blocks/ProgressBar.html.twig'
              category: 'label.category_elements'
              priority: 60
              pickable: true
              cacheable: true

    ui.block.progress_tracker:
        class: stdClass
        tags:
            - name: ui.block
              kind: progress_tracker
              label: "label.block_progress_tracker"
              description: "label.block_progress_tracker_description"
              form: c975L\UiBundle\Form\Block\ProgressTrackerType
              translatable: 'eyebrow, title, note'
              template: '@c975LUi/blocks/ProgressTracker.html.twig'
              category: 'label.category_elements'
              priority: 59
              pickable: true
              cacheable: true

    ui.block.slider:
        class: stdClass
        tags:
            - name: ui.block
              kind: slider
              label: "label.block_slider"
              description: "label.block_slider_description"
              form: c975L\UiBundle\Form\Block\SliderType
              template: '@c975LUi/blocks/Slider.html.twig'
              category: 'label.category_media'
              media_types: 'image/*,video/*'
              media_multi_upload: true
              priority: 90
              pickable: true
              cacheable: true

    ui.block.text_hook:
        class: stdClass
        tags:
            - name: ui.block
              kind: text_hook
              label: "label.block_text_hook"
              description: "label.block_text_hook_description"
              form: c975L\UiBundle\Form\Block\TextHookType
              translatable: 'text'
              template: '@c975LUi/blocks/TextHook.html.twig'
              category: 'label.category_text'
              priority: 95
              pickable: true
              cacheable: true

    ui.block.text_readmore:
        class: stdClass
        tags:
            - name: ui.block
              kind: text_readmore
              label: "label.block_text_readmore"
              description: "label.block_text_readmore_description"
              form: c975L\UiBundle\Form\Block\ReadmoreType
              translatable: 'text'
              template: '@c975LUi/blocks/TextReadmore.html.twig'
              category: 'label.category_text'
              priority: 90
              pickable: true
              cacheable: true

    ui.block.text_section:
        class: stdClass
        tags:
            - name: ui.block
              kind: text_section
              label: "label.block_text_section"
              description: "label.block_text_section_description"
              form: c975L\UiBundle\Form\Block\TextSectionType
              translatable: 'eyebrow, title, content'
              template: '@c975LUi/blocks/TextSection.html.twig'
              category: 'label.category_text'
              media_types: 'image/*'
              priority: 100
              pickable: true
              cacheable: true

    ui.block.video:
        class: stdClass
        tags:
            - name: ui.block
              kind: video
              label: "label.block_video"
              description: "label.block_video_description"
              form: c975L\UiBundle\Form\Block\VideoType
              translatable: 'title, description'
              template: '@c975LUi/blocks/Video.html.twig'
              category: 'label.category_media'
              # Explicit list rather than "video/*": these three are the formats every browser's <video> can actually play, and it's this list that fills the upload's "accept" - the block's own form no longer asks for the format, it's read back from the uploaded file's mimeType. "image/*" is the optional cover image (poster), see blocks/Video.html.twig
              media_types: 'video/mp4,video/webm,video/ogg,image/*'
              media_help: 'label.video_media_help'
              priority: 80
              pickable: true
              cacheable: true

    ui.block.video_iframe:
        class: stdClass
        tags:
            - name: ui.block
              kind: video_iframe
              label: "label.block_video_iframe"
              description: "label.block_video_iframe_description"
              form: c975L\UiBundle\Form\Block\VideoIframeType
              translatable: 'title, description'
              template: '@c975LUi/blocks/VideoIframe.html.twig'
              category: 'label.category_media'
              # The single media is the player's poster - either imported from the platform by ticking the block's own "importPoster" (see VideoPosterImporter) or uploaded here by hand. Its presence is also what turns the player into click-to-play (see assets/js/video-iframe.js)
              media_types: 'image/*'
              media_help: 'label.video_iframe_media_help'
              priority: 60
              pickable: true
              cacheable: true

    # Page section blocks (landing-page style sections, see README "Sections de page")
    ui.block.hero:
        class: stdClass
        tags:
            - name: ui.block
              kind: hero
              label: "label.block_hero"
              description: "label.block_hero_description"
              form: c975L\UiBundle\Form\Block\HeroType
              translatable: 'badge, title, subtitle, primaryLabel, secondaryLabel, statValue, statLabel'
              template: '@c975LUi/blocks/Hero.html.twig'
              category: 'label.category_sections'
              # Same three video formats as the "video" kind - the ones every browser's <video> can play - beside the images. A video is always painted behind the section, an image beside the text or behind it, told apart by mimetype in blocks/Hero.html.twig
              media_types: 'image/*,video/mp4,video/webm,video/ogg'
              media_help: 'label.hero_media_help'
              media_multi_upload: true
              priority: 100
              pickable: true
              cacheable: true

    ui.block.feature_bar:
        class: stdClass
        tags:
            - name: ui.block
              kind: feature_bar
              label: "label.block_feature_bar"
              description: "label.block_feature_bar_description"
              form: c975L\UiBundle\Form\Block\FeatureBarType
              translatable: 'eyebrow, title'
              template: '@c975LUi/blocks/FeatureBar.html.twig'
              category: 'label.category_sections'
              priority: 90
              pickable: true
              cacheable: true

    ui.block.section_features:
        class: stdClass
        tags:
            - name: ui.block
              kind: section_features
              label: "label.block_section_features"
              description: "label.block_section_features_description"
              form: c975L\UiBundle\Form\Block\SectionFeaturesType
              translatable: 'eyebrow, title'
              template: '@c975LUi/blocks/SectionFeatures.html.twig'
              category: 'label.category_sections'
              priority: 80
              pickable: true
              cacheable: true

    # Slots are real nested Block rows (see Block::$slots), each picked/edited through the normal kind form - cacheable like any other kind since BlockCacheTagResolver puts every slot's own "block_{id}" on this block's entry, and BlockCacheInvalidationListener walks back up to it whenever one of them changes. A slot of a kind that can't be cached (a form, a twig_content) takes the whole container out of the cache with it, its html being held here verbatim.
    ui.block.flex_columns:
        class: stdClass
        tags:
            - name: ui.block
              kind: flex_columns
              label: "label.block_flex_columns"
              description: "label.block_flex_columns_description"
              form: c975L\UiBundle\Form\Block\FlexColumnsType
              template: '@c975LUi/blocks/FlexColumns.html.twig'
              category: 'label.category_sections'
              priority: 75
              pickable: true
              cacheable: true
              container: true
              slot_context: 'flex_columns_slot'

    # A single flex_columns column, itself grouping several other blocks (its own "slots") - only ever meant to be picked as a flex_columns row's own slot (contexts restricts it to BlockRegistry::FLEX_COLUMNS_SLOT_CONTEXT, which is exclusive, so it is also the ONLY kind offered there).
    # Every real picker passes a context (PageCrudController 'page', MenuCrudController 'menu', BlockFormController the container's own slot context), so this kind only ever shows up in a flex_columns row's slots - a context-less caller would still list it, harmless if it ever happens, it just renders its slots with no wrapper of its own.
    # Its priority only ever ranks it in such a context-less picker, never in a row's slots, where the exclusive context already leaves it alone in the list - so it stays where every other kind of the "sections" category puts it, rather than opening one it has no business opening.
    ui.block.flex_column:
        class: stdClass
        tags:
            - name: ui.block
              kind: flex_column
              label: "label.block_flex_column"
              description: "label.block_flex_column_description"
              form: c975L\UiBundle\Form\Block\FlexColumnType
              template: '@c975LUi/blocks/FlexColumn.html.twig'
              category: 'label.category_sections'
              priority: 74
              pickable: true
              cacheable: true
              container: true
              contexts: 'flex_columns_slot'
              slot_context: 'flex_slot_nested'

    # The link to this bundle's own wishlist page, offered to whoever builds menus out of these blocks (SiteBundle's navbar and footer) rather than declared over there: the page, the heart and the count are this bundle's, so the item leading to them is too, and a menu simply lists what it is offered
    # "menu_navbar" is an exclusive context (see BlockRegistry::EXCLUSIVE_CONTEXTS): opting into it is what gets the item offered in a navbar at all, where only links are. "menu_slot" is not this bundle's own - it is the slot context of the "menu_group" a menu builds its lines with, named here so the item can be dropped into one
    ui.block.favorite_link:
        class: stdClass
        tags:
            - name: ui.block
              kind: favorite_link
              label: "label.block_favorite_link"
              description: "label.block_favorite_link_description"
              form: c975L\UiBundle\Form\Block\FavoriteLinkType
              translatable: 'label'
              template: '@c975LUi/blocks/FavoriteLink.html.twig'
              category: 'label.category_navigation'
              pickable: true
              # Its "active" state depends on the current request path, which no shared cache entry can hold
              cacheable: false
              contexts: 'menu,menu_navbar,menu_slot'

    # The one container with no chrome of its own: a bare row (or stack) around blocks that would otherwise sit side by side at the top level, e.g. a footer menu's social links on their own line above its links.
    # No slot_context of its own, so its slots take BlockRegistry::SLOT_CONTEXT, where containers are excluded - a group can't hold another group, which is the depth guard a chromeless wrapper would otherwise miss.
    ui.block.block_group:
        class: stdClass
        tags:
            - name: ui.block
              kind: block_group
              label: "label.block_block_group"
              description: "label.block_block_group_description"
              form: c975L\UiBundle\Form\Block\BlockGroupType
              template: '@c975LUi/blocks/BlockGroup.html.twig'
              category: 'label.category_sections'
              priority: 73
              pickable: true
              cacheable: true
              container: true

    # A stack of full "card" blocks (or any other kind) with a section-level eyebrow/title/anchor - same container mechanism as flex_columns above, but its slots render inside ".cards" (see components/Section/Cards.html.twig), the same fixed-width flex row used when "card" blocks are placed bare and consecutively in the page flow (see Blocks.html.twig) - giving that exact look plus an anchor and section head, which bare consecutive "card" blocks can't have on their own.
    ui.block.section_cards:
        class: stdClass
        tags:
            - name: ui.block
              kind: section_cards
              label: "label.block_section_cards"
              description: "label.block_section_cards_description"
              form: c975L\UiBundle\Form\Block\SectionCardsType
              template: '@c975LUi/blocks/SectionCards.html.twig'
              category: 'label.category_sections'
              priority: 79
              pickable: true
              cacheable: true
              container: true

    ui.block.expertise_banner:
        class: stdClass
        tags:
            - name: ui.block
              kind: expertise_banner
              label: "label.block_expertise_banner"
              description: "label.block_expertise_banner_description"
              form: c975L\UiBundle\Form\Block\ExpertiseBannerType
              translatable: 'eyebrow, title, text'
              template: '@c975LUi/blocks/ExpertiseBanner.html.twig'
              category: 'label.category_sections'
              priority: 70
              pickable: true
              cacheable: true

    ui.block.process_steps:
        class: stdClass
        tags:
            - name: ui.block
              kind: process_steps
              label: "label.block_process_steps"
              description: "label.block_process_steps_description"
              form: c975L\UiBundle\Form\Block\ProcessStepsType
              translatable: 'eyebrow, title'
              template: '@c975LUi/blocks/ProcessSteps.html.twig'
              category: 'label.category_sections'
              priority: 60
              pickable: true
              cacheable: true

    ui.block.portfolio_grid:
        class: stdClass
        tags:
            - name: ui.block
              kind: portfolio_grid
              label: "label.block_portfolio_grid"
              description: "label.block_portfolio_grid_description"
              form: c975L\UiBundle\Form\Block\PortfolioGridType
              translatable: 'eyebrow, title, linkLabel'
              template: '@c975LUi/blocks/PortfolioGrid.html.twig'
              category: 'label.category_sections'
              media_types: 'image/*'
              media_multi_upload: true
              priority: 55
              pickable: true
              cacheable: true

    # A grid of whole blocks under a section head, same container mechanism as flex_columns/section_cards above, and like section_cards it declares no slot_context: any kind can fill a cell, "video_iframe" and "video" being what it is for. Slots rather than a media collection of its own precisely so a grid of platform players inherits the consent dance (nocookie rewrite, banner contract, click-to-play, poster import) from the block that already carries it, instead of implementing it a second time
    ui.block.video_grid:
        class: stdClass
        tags:
            - name: ui.block
              kind: video_grid
              label: "label.block_video_grid"
              description: "label.block_video_grid_description"
